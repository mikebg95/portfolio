# nginx for the static site in the Docker image (Dockerfile). Runs as the unprivileged nginx user
# on 8080. The brotli_static module is built in the Dockerfile's `brotli` stage.
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    # No query strings or referrers in the log: requests only, never anything personal.
    log_format site '$time_iso8601 $status "$request_method $uri" $body_bytes_sent';
    access_log /var/log/nginx/access.log site;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Text files carry .gz / .br twins written at build time (scripts/precompress.ts).
    gzip_static on;
    brotli_static on;
    gzip_vary on;

    # Hashed build assets never change under their name; everything else (HTML, the service
    # worker, the manifest, fonts and icons under fixed names) is revalidated on each use.
    map $uri $cache_control {
        ~^/_astro/ "public, max-age=31536000, immutable";
        default "no-cache";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirects stay relative, so /experience → /experience/ works behind any port mapping.
        absolute_redirect off;

        add_header Cache-Control $cache_control;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        location / {
            try_files $uri $uri/ =404;
            error_page 404 /404.html;
        }

        location /nl/ {
            try_files $uri $uri/ =404;
            error_page 404 /nl/404/index.html;
        }
    }
}
