howIWork:
  - title: Design before build
    body: Requirements, a C4 model, a database schema and an API contract come first, and I write down the trade-offs I make. Then the code follows the drawing.
  - title: Test first
    body: 'The test comes before the code: unit, slice, integration against real databases with Testcontainers, and architecture rules with ArchUnit. 251 hand-written tests across my portfolio series.'
  - title: Secure by design
    body: 'Sign-in and permissions are where I go deepest: single sign-on with Microsoft Entra ID and Keycloak, OAuth2 / OIDC, JWT, method security — and tests that prove it.'
  - title: Own it to production
    body: At DJI I was the only developer on a new application, from the first design to deployment with operations and a full handover. Docker and CI/CD are part of the job, not someone else's.
aiNote: ON AI — I build with AI coding agents every day, with tests, architecture rules and review as the guardrails, and I label what was AI-built. The portfolio series and its tests are written by hand.
