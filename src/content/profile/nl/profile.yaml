howIWork:
  - title: Eerst ontwerpen, dan bouwen
    body: Requirements, een C4-model, een databaseschema en een API-contract komen eerst, en ik leg de afwegingen vast die ik maak. Daarna volgt de code de tekening.
  - title: Test first
    body: 'De test komt vóór de code: unit, slice, integratie tegen echte databases met Testcontainers, en architectuurregels met ArchUnit. 251 handgeschreven tests in mijn portfolioserie.'
  - title: Secure by design
    body: 'Inloggen en rechten zijn waar ik het diepst op inga: single sign-on met Microsoft Entra ID en Keycloak, OAuth2 / OIDC, JWT, method security — en tests die het bewijzen.'
  - title: Eigenaar tot in productie
    body: Bij DJI was ik de enige developer van een nieuwe applicatie, van het eerste ontwerp tot de uitrol met operations en een volledige overdracht. Docker en CI/CD horen bij het werk, niet bij dat van een ander.
aiNote: OVER AI — Ik bouw elke dag met AI-coding-agents, met tests, architectuurregels en review als vangrails, en ik vermeld wat door AI is gebouwd. De portfolioserie en de tests ervan schrijf ik met de hand.
