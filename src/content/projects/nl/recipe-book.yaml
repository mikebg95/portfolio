spec:
  - label: AGGREGATE
    text: 'Recipe is de aggregate root: stappen en ingrediënten worden alleen via de root bereikt, opgeslagen en verwijderd — cascade ALL en orphanRemoval in JPA, ON DELETE CASCADE in het schema.'
  - label: PERSISTENTIE
    text: "JPA/Hibernate via een handgeschreven EntityManager-repository, geen Spring Data. SEQUENCE-id's met allocationSize 50, equals op id, open-in-view uit."
  - label: CONCURRENCY
    text: '@Version optimistic locking: een gelijktijdige wijziging krijgt 409 Conflict als RFC 9457 problem details.'
  - label: QUERIES
    text: 'De lijst leest een RecipeSummary-projectie — naam, beschrijving en aantallen — in plaats van hele aggregates te laden.'
  - label: INTEGRITEIT
    text: 'CHECK-constraints, hoofdletterongevoelig unieke namen en een deferrable unieke stapvolgorde, verdeeld over 5 Flyway-migraties op PostgreSQL 18.'
  - label: API
    text: "Design-first OpenAPI 3.1: openapi-generator bouwt de DTO's en API-interfaces uit docs/api/openapi.yaml; de mappers zijn handgeschreven."
  - label: TESTEN
    text: '109 tests, test-first geschreven: unit, web slice, repository en end-to-end op Testcontainers, plus ArchUnit-regels die de gelaagdheid afdwingen.'
