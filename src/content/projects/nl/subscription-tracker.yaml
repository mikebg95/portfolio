spec:
  - label: LAYERS
    text: 'Controller → service → DAO, each talking only to the one beneath. DTOs at the edge; the entity never leaves the service.'
  - label: DATA ACCESS
    text: 'Spring JDBC: JdbcTemplate with hand-written, parameterized SQL and RowMappers — no JPA, no Spring Data.'
  - label: MIGRATIONS
    text: 'Flyway on PostgreSQL 16. V2 replaces a plain unique constraint with a case-insensitive unique index on LOWER(name).'
  - label: API
    text: 'Code-first OpenAPI with springdoc and Swagger UI; versioned under /api/v1, Bean Validation at the edge.'
  - label: ERRORS
    text: 'RFC 9457 problem details (400, 404, 409) from one exception handler; unexpected errors get a generic message, never the exception text.'
  - label: TESTING
    text: '63 tests, written test-first: unit, web slice, DAO integration and end-to-end against a real PostgreSQL on Testcontainers; JaCoCo coverage.'
