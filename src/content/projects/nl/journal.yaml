cardSummary: 'Hexagonale architectuur, een rijk domeinmodel en 7 vastgelegde ontwerpbeslissingen. De AI-stap die elke notitie samenvat is ontworpen en komt hierna.'
summary: "Een dagboek dat zo is ontworpen dat één AI-aanroep elke notitie omzet in een samenvatting, tags, een stemming en to-do's — en dat de notitie ook wordt opgeslagen als de AI onbereikbaar is. Deel 3 van de serie: hexagonale architectuur en een rijk domeinmodel."
