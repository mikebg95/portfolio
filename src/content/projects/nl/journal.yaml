spec:
  - label: ARCHITECTUUR
    text: 'Hexagonaal: domain/model, application/port/in en out, adapter/in/web, adapter/out/persistence en ai. ArchUnit laat de build falen als een grens wordt overschreden.'
  - label: DOMEIN
    text: 'Een rijk domeinmodel — Entry, Tag, Todo — waarvan de objecten zelf een ongeldige toestand weigeren; application services werken alleen via ports.'
  - label: AI
    text: "Gepland: één Spring AI-aanroep zet een notitie om in een samenvatting, tags, een stemming en to-do's. Mislukt de aanroep, dan wordt de notitie toch opgeslagen (graceful degradation)."
  - label: PERSISTENTIE
    text: 'In uitvoering: een Spring Data JPA-adapter op PostgreSQL 18 met Flyway, MapStruct-mapping tussen het domein en de JPA-entities.'
  - label: CONCURRENCY
    text: 'Optimistic locking op notities: een gelijktijdige wijziging wordt herkend aan een versiekolom en als conflict aan de gebruiker voorgelegd.'
  - label: API
    text: 'Design-first OpenAPI 3.1-contract, geschreven vóór de code; de geplande REST-adapter wordt eruit gegenereerd.'
  - label: TESTEN
    text: '79 tests, test-first geschreven: unit tests voor domein en services met in-memory fakes, persistentie op Testcontainers, ArchUnit op de hexagonale grenzen.'
