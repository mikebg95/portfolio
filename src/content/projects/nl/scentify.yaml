spec:
  - label: PLATFORM
    text: 'Android in Java (min SDK 21, target SDK 29); XML layouts with AndroidX AppCompat, Material Components and ConstraintLayout.'
  - label: SCREENS
    text: 'Four activities joined by explicit Intents — home, questionnaire, results, detail. The answers travel as a HashMap extra.'
  - label: MATCHING
    text: 'A fragrance is recommended only if it matches every answer; "Doesn''t matter" is a wildcard. Age ranges use android.util.Range.'
  - label: LIST
    text: 'Results render through PerfumeAdapter, a custom ArrayAdapter with its own row layout.'
  - label: CATALOGUE
    text: '52 fragrances, each with brand, name, seasons, age range, lifestyle, type and image.'
  - label: LIMITATIONS
    text: 'Named in the README: the catalogue is hard-coded in an activity, matching is strict rather than scored, and buttons are styled with touch listeners.'
