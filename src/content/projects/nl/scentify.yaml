spec:
  - label: PLATFORM
    text: 'Android in Java (min SDK 21, target SDK 29); XML-layouts met AndroidX AppCompat, Material Components en ConstraintLayout.'
  - label: SCHERMEN
    text: 'Vier activities, verbonden door expliciete Intents — home, vragenlijst, resultaten, detail. De antwoorden reizen mee als HashMap-extra.'
  - label: MATCHING
    text: 'Een parfum wordt alleen aanbevolen als het bij elk antwoord past; "Maakt niet uit" is een wildcard. Leeftijdsbereiken gebruiken android.util.Range.'
  - label: LIJST
    text: 'De resultaten worden getoond via PerfumeAdapter, een eigen ArrayAdapter met een eigen rij-layout.'
  - label: CATALOGUS
    text: '52 parfums, elk met merk, naam, seizoenen, leeftijdsbereik, levensstijl, type en afbeelding.'
  - label: BEPERKINGEN
    text: 'Benoemd in de README: de catalogus staat hard-coded in een activity, de matching is strikt in plaats van met scores, en knoppen zijn opgemaakt met touch listeners.'
