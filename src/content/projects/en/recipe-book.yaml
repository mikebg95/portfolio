spec:
  - label: AGGREGATE
    text: 'Recipe is the aggregate root: steps and ingredients are reached, saved and deleted only through it — cascade ALL and orphanRemoval in JPA, ON DELETE CASCADE in the schema.'
  - label: PERSISTENCE
    text: 'JPA/Hibernate through a hand-written EntityManager repository, no Spring Data. SEQUENCE ids with allocationSize 50, id-based equals, open-in-view off.'
  - label: CONCURRENCY
    text: '@Version optimistic locking: a concurrent edit gets 409 Conflict as RFC 9457 problem details.'
  - label: QUERIES
    text: 'The list reads a RecipeSummary projection — name, description and counts — instead of loading whole aggregates.'
  - label: INTEGRITY
    text: 'CHECK constraints, case-insensitive unique names and deferrable unique step order, across 5 Flyway migrations on PostgreSQL 18.'
  - label: API
    text: 'Design-first OpenAPI 3.1: openapi-generator builds the DTOs and API interfaces from docs/api/openapi.yaml; the mappers are hand-written.'
  - label: TESTING
    text: '109 tests, written test-first: unit, web slice, repository and end-to-end on Testcontainers, plus ArchUnit rules that enforce the layering.'
