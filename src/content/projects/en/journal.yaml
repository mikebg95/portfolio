spec:
  - label: ARCHITECTURE
    text: 'Hexagonal: domain/model, application/port/in and out, adapter/in/web, adapter/out/persistence and ai. ArchUnit fails the build if a boundary is crossed.'
  - label: DOMAIN
    text: 'A rich domain model — Entry, Tag, Todo — whose objects reject invalid state themselves; application services work through ports only.'
  - label: AI
    text: 'Planned: one Spring AI call turns an entry into a summary, tags, a mood and to-dos. If the call fails, the entry is still saved (graceful degradation).'
  - label: PERSISTENCE
    text: 'In progress: a Spring Data JPA adapter on PostgreSQL 18 with Flyway, MapStruct mapping between the domain and JPA entities.'
  - label: CONCURRENCY
    text: 'Optimistic locking on entries: a concurrent edit is detected by a version column and surfaced as a conflict for the user to resolve.'
  - label: API
    text: 'Design-first OpenAPI 3.1 contract, written before the code; the planned REST adapter is generated from it.'
  - label: TESTING
    text: '79 tests, written test-first: domain and service unit tests with in-memory fakes, persistence on Testcontainers, ArchUnit on the hexagonal boundaries.'
